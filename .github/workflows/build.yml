name: Build Demo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Gradle wrapper (jar is binary, so it is not stored in git)
        working-directory: android
        run: |
          curl -sL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: absher-demo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish APK to release v1.0-demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          if gh release view v1.0-demo >/dev/null 2>&1; then
            gh release upload v1.0-demo "$APK" --clobber
          else
            gh release create v1.0-demo "$APK" \
              --title "Absher Demo v1.0" \
              --notes "Interactive demo build (sample data only). Download app-debug.apk and install it on an Android phone to preview."
          fi
